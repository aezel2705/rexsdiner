<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits & Prix - Rex Diner's</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rex Diner's</h1>
            <p>Gestion & Comptabilité</p>
        </header>

        <nav class="sidebar" id="sidebar">
            <ul id="nav-menu"></ul>
        </nav>

        <main>
            <div class="page-header">
                <h2>Produits & Prix</h2>
                <p>Gérez votre carte et vos prix</p>
                <button id="btn-ajouter-produit" class="btn-success">+ Ajouter un produit</button>
            </div>

            <div class="table-container">
                <table id="produits-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Type</th>
                            <th>Prix de vente</th>
                            <th>Coût fabrication</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="produits-body">
                        <tr><td colspan="7">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal pour ajouter/modifier un produit -->
            <div id="modal-produit" class="modal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h3 id="modal-produit-title">Ajouter un produit</h3>
                    <form id="produit-form">
    <div class="form-group">
        <label>Nom du produit</label>
        <input type="text" id="prod-nom" required>
    </div>
    <div class="form-group">
        <label>Type</label>
        <select id="prod-type" required>
            <option value="unitaire">Unitaire</option>
            <option value="menu">Menu</option>
        </select>
    </div>
    <div class="form-group">
        <label>Prix de vente ($)</label>
        <input type="number" id="prod-prix-vente" min="0" step="0.01" required>
    </div>
    <div class="form-group">
        <label>Coût de fabrication ($)</label>
        <input type="number" id="prod-cout-fab" min="0" step="0.01" required>
    </div>
    <input type="hidden" id="prod-id">
    
    <!-- Composition menu -->
    <div id="menu-composition" style="display: none;">
        <hr style="margin: 20px 0;">
        <h4>🍽️ Composition du menu</h4>
        <p style="font-size: 0.85rem; color: #666;">Ajoutez les produits qui composent ce menu</p>
        <div id="composition-list"></div>
        <button type="button" id="btn-ajouter-composition" class="btn-success" style="margin-top: 10px;">+ Ajouter un produit au menu</button>
    </div>
    
    <button type="submit" class="btn-primary">Enregistrer</button>
</form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/produits-prix.js"></script>
</body>
</html>
