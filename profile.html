<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Rex Diner's</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rex Diner's</h1>
            <p>Gestion & Comptabilité</p>
        </header>

        <nav class="sidebar" id="sidebar">
            <ul id="nav-menu"></ul>
        </nav>

        <main>
            <div class="profile-container">
                <h2>Mon Profil</h2>
                
                <div class="profile-card">
                    <div class="profile-avatar">
                        👤
                    </div>
                    <div class="profile-info">
                        <h3 id="profile-nom"></h3>
                        <p id="profile-poste"></p>
                    </div>
                </div>

                <form id="profile-form" class="profile-form">
                    <h3>Modifier mes informations</h3>
                    
                    <div class="form-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="profile-username" readonly>
                    </div>

                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="profile-nom-complet">
                    </div>

                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" id="profile-new-password" placeholder="Laisser vide pour ne pas changer">
                    </div>

                    <div class="form-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" id="profile-confirm-password" placeholder="Confirmer le nouveau mot de passe">
                    </div>

                    <div id="profile-message" class="message" style="display: none;"></div>

                    <button type="submit" class="btn-primary">Enregistrer les modifications</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
