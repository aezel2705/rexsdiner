<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Rex Diner's</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 130px);
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
        }
        .chat-message.moi {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .chat-message.autre {
            align-self: flex-start;
            background: #e8e8e8;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .chat-message .auteur {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 3px;
            opacity: 0.8;
        }
        .chat-message .heure {
            font-size: 0.7rem;
            opacity: 0.6;
            text-align: right;
            margin-top: 5px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            background: var(--card-bg);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-area button {
            padding: 12px 25px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        /* Mode sombre */
        body.dark-mode .chat-message.autre {
            background: #2a2a3e;
            color: #e0e0e0;
        }
        body.dark-mode .chat-input-area {
            border-color: rgba(108,92,231,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-brand">
                <h1>Rex Diner's</h1>
                <p>Gestion & Comptabilité</p>
            </div>
        </header>

        <nav class="sidebar" id="sidebar">
            <ul id="nav-menu"></ul>
        </nav>

        <main>
            <div class="page-header">
                <h2>💬 Chat interne</h2>
                <p>Communiquez avec votre équipe en temps réel</p>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <p style="text-align: center; color: #999;">Chargement des messages...</p>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Écrivez votre message..." maxlength="500">
                    <button id="btn-send">Envoyer</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
