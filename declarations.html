<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déclarations - Rex Diner's</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rex Diner's</h1>
            <p>Gestion & Comptabilité</p>
        </header>

        <nav class="sidebar" id="sidebar">
            <ul id="nav-menu"></ul>
        </nav>

        <main>
            <div class="page-header">
                <h2>Déclarations</h2>
                <p>Historique de toutes les ventes déclarées</p>
            </div>

            <div class="filters">
                <div class="form-group">
                    <label>Filtrer par employé</label>
                    <select id="filter-employe">
                        <option value="">Tous les employés</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Filtrer par date</label>
                    <input type="date" id="filter-date">
                </div>
                <button id="btn-reset-filters" class="btn-secondary">Réinitialiser</button>
            </div>

            <div class="table-container">
                <table id="declarations-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Employé</th>
                            <th>Produits</th>
                            <th>Type</th>
                            <th>Montant total</th>
                            <th>Bénéfice net</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="declarations-body">
                        <tr><td colspan="6">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/declarations.js"></script>
</body>
</html>
